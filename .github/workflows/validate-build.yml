name: Validate web build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "base44/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/validate-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate Vite/Base44 build for Vercel preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check framework compatibility
        run: npm run framework:check

      - name: Build optimized website
        run: npm run build
